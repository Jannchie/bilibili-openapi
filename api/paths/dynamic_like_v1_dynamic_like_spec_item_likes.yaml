get:
  tags:
    - 动态基本信息
  summary: 动态点赞列表
  description: |
    点赞列表总计超过25K部分继续获取可能被限制。

    由于参数过多，这里不一一列举，请自行参阅其他文件理解。
  servers:
    - url: https://api.vc.bilibili.com
  parameters:
    - name: dynamic_id
      in: query
      description: 动态id
      schema:
        type: integer
      required: true
    - name: pn
      in: query
      description: 页码
      schema:
        type: integer
    - name: ps
      in: query
      description: 每页数量
      schema:
        type: integer
        maximum: 20
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SpecItemLikesResponse.yaml
