get:
  tags:
    - 相簿
  servers:
    - url: https://api.vc.bilibili.com
  summary: 获取指定用户的相簿列表
  parameters:
    - in: cookie
      name: SESSDATA
      required: true
      schema:
        type: string
      description: SESSDATA Cookie
    - name: biz
      in: query
      description: 分区
      required: false
      schema:
        type: integer
        format: int64
        enum:
          - 0
          - 1
          - 2
        default: 0
    - name: poster_uid
      in: query
      description: 作者 mid
      required: true
      schema:
        type: integer
        format: int64
    - name: page_num
      in: query
      description: 页码
      required: false
      schema:
        type: integer
        format: int64
        default: 1
    - name: page_size
      in: query
      description: 每页项数
      required: false
      schema:
        type: integer
        format: int64
        default: 45
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AlbumOthersResponse.yaml
