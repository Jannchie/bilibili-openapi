get:
  tags:
    - 历史弹幕
  summary: 获取历史弹幕protobuf接口
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  parameters:
    - name: type
      in: query
      description: 弹幕类
      schema:
        type: integer
        enum:
          - 1
      required: true
    - name: oid
      in: query
      description: 视频cid
      schema:
        type: integer
      required: true
    - name: date
      in: query
      description: 弹幕日期
      schema:
        type: string
        format: date
      required: true
  responses:
    '200':
      description: 成功
      content:
        application/protobuf:
          schema:
            $ref: ../components/schemas/DmSegMobileReply.yaml
