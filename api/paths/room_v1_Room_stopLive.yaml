post:
  tags:
    - 直播间管理
  summary: 关闭直播
  servers:
    - url: https://api.live.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          required:
            - room_id
            - csrf
          type: object
          properties:
            room_id:
              type: integer
              format: int32
              description: 直播间 ID
            csrf:
              type: string
              description: CSRF Token（位于 cookie）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/StopLiveResponse.yaml
