get:
  tags:
    - 电磁力
  servers:
    - url: https://api.bilibili.com
  parameters:
    - name: access_key
      in: query
      description: APP 登录 Token
      schema:
        type: string
    - name: type
      in: query
      description: 目标数据类型, 类型代码见下表
      schema:
        type: integer
        enum:
          - 1
          - 2
          - 3
      required: true
  security:
    - sessionData: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ElecHistoryResponse.yaml
