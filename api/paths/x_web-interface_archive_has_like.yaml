get:
  tags:
    - 点赞
  servers:
    - url: https://api.bilibili.com
  summary: 判断视频近期是否被点赞（双端）
  parameters:
    - in: query
      name: access_key
      schema:
        type: string
      required: false
      description: APP 登录 Token
    - in: query
      name: aid
      schema:
        type: integer
      required: false
      description: 稿件 avid
    - in: query
      name: bvid
      schema:
        type: string
      required: false
      description: 稿件 bvid
  responses:
    '200':
      description: 点赞状态
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ArchiveHasLikeResponse.yaml
