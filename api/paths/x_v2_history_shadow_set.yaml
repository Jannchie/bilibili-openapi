post:
  tags:
    - 历史记录
  summary: 停用历史记录
  description: 该操作不会影响原有历史记录
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      x-www-form-urlencoded:
        schema:
          required:
            - csrf
          type: object
          properties:
            switch:
              type: boolean
              default: false
            csrf:
              type: string
              description: CSRF Token（位于cookie）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/HistoryShadowSetResponse.yaml
