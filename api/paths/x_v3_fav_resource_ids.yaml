get:
  tags:
    - 收藏夹
  summary: 获取收藏夹全部内容id
  description: 注：查询权限收藏夹时需要相应用户登录
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  parameters:
    - name: media_id
      in: query
      description: 目标收藏夹mlid（完整id）
      schema:
        type: integer
        format: int32
      required: true
    - name: platform
      in: query
      description: 平台标识
      schema:
        type: string
        example: web
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FavResourceIdsResponse.yaml
