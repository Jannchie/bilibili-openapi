get:
  tags:
    - 包月充电
  summary: 包月充电用户排名
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  parameters:
    - name: up_mid
      in: query
      description: 目标用户mid
      schema:
        type: integer
      required: true
    - name: ps
      in: query
      description: 每页项数
      schema:
        type: integer
        default: 20
    - name: pn
      in: query
      description: 页码
      schema:
        type: integer
        default: 1
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UpMemberRankResponse.yaml
