get:
  tags:
    - 用户基本信息
  servers:
    - url: https://api.bilibili.com
  summary: 用户空间详细信息
  parameters:
    - in: query
      name: mid
      schema:
        type: integer
      required: true
      description: 目标用户 mid
    - in: query
      name: w_rid
      schema:
        type: string
      required: true
      description: Wbi 签名
    - in: query
      name: wts
      schema:
        type: integer
      required: true
      description: 当前时间戳
  responses:
    '200':
      description: 用户详细信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/UserInfoDetailResponse.yaml
