post:
  tags:
    - 一键三连
  servers:
    - url: https://app.bilibili.com
  summary: 一键三连视频（APP 端）
  parameters:
    - in: header
      name: access_key
      schema:
        type: string
      required: true
      description: APP 登录 Token
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/ViewLikeTripleRequest.yaml
  responses:
    '200':
      description: 三连结果
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ViewLikeTripleResponse.yaml
