post:
  tags:
    - 登录
  summary: 获取 captcha
  servers:
    - url: https://passport.bilibili.com
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          required:
            - source
          type: object
          properties:
            source:
              type: string
              default: risk
              description: risk
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/PreCaptchaResponse.yaml
