post:
  tags:
    - 历史记录
  summary: 删除历史记录
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      x-www-form-urlencoded:
        schema:
          required:
            - kid
            - csrf
          type: object
          properties:
            kid:
              type: string
              description: 删除的目标记录，格式为`{业务类型}_{目标id}`详见备注
            csrf:
              type: string
              description: CSRF Token（位于cookie）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/HistoryDeleteResponse.yaml
