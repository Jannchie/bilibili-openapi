get:
  tags:
    - 视频在线人数
  servers:
    - url: https://app.bilibili.com
  summary: 获取视频在线人数 (APP 端)
  parameters:
    - in: query
      name: aid
      schema:
        type: integer
      required: true
      description: 稿件 avid
    - in: query
      name: appkey
      schema:
        type: string
        default: 1d8b6e7d45233436
      required: true
      description: APP 密钥
    - in: query
      name: cid
      schema:
        type: integer
      required: true
      description: 视频 cid
    - in: query
      name: ts
      schema:
        type: integer
      required: true
      description: 当前时间戳
    - in: query
      name: sign
      schema:
        type: string
      required: true
      description: APP 签名
  responses:
    '200':
      description: 视频在线人数
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ViewVideoOnlineResponse.yaml
