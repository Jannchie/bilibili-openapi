get:
  tags:
    - 用户关系相关
  servers:
    - url: https://line3-h5-mobile-api.biligame.com
  summary: 查询用户关注明细3
  parameters:
    - in: query
      name: vmid
      schema:
        type: integer
      required: true
      description: 目标用户 mid
    - in: query
      name: ps
      schema:
        type: integer
        default: 20
      required: false
      description: 每页项数
    - in: query
      name: pn
      schema:
        type: integer
        default: 1
      required: false
      description: 页码
  responses:
    '200':
      description: 用户关注明细3
      content:
        application/json:
          schema:
            $ref: ../components/schemas/RelationFollowingsV3Response.yaml
