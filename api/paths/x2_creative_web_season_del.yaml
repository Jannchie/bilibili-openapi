post:
  tags:
    - 合集管理
  servers:
    - url: https://member.bilibili.com
  parameters:
    - name: id
      in: query
      description: 合集ID
      schema:
        type: integer
      required: true
    - name: csrf
      in: query
      description: CSRF Token(即Cookie中bili_jct)
      schema:
        type: string
      required: true
  security:
    - sessionData: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SeasonDelResponse.yaml
