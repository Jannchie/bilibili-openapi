post:
  tags:
    - 充电
  summary: 发送充电留言
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          required:
            - order_id
            - message
            - csrf
          type: object
          properties:
            order_id:
              type: string
              description: 留言token
            message:
              type: string
              description: 留言内容
            csrf:
              type: string
              description: CSRF Token（位于cookie）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SetElecMessageResponse.yaml
