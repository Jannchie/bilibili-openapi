post:
  tags:
    - 直播间管理
  summary: 解除禁言
  servers:
    - url: https://api.live.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          required:
            - roomid
            - id
            - csrf_token
            - csrf
          type: object
          properties:
            roomid:
              type: string
              description: 直播间 ID
            id:
              type: integer
              format: int32
              description: 禁言记录 ID
            csrf_token:
              type: string
              description: CSRF Token
            csrf:
              type: string
              description: CSRF Token
            visit_id:
              type: string
              description: 不明
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DelRoomBlockUserResponse.yaml
