post:
  tags:
    - 点赞
  servers:
    - url: https://app.bilibili.com
  summary: 点赞视频（APP 端）
  parameters:
    - in: header
      name: access_key
      schema:
        type: string
      required: true
      description: APP 登录 Token
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/ViewLikeRequest.yaml
  responses:
    '200':
      description: 点赞结果
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ViewLikeResponse.yaml
