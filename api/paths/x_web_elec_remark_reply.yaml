post:
  tags:
    - 充电
  summary: 回复充电留言
  servers:
    - url: https://member.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          required:
            - csrf
            - id
            - msg
          type: object
          properties:
            csrf:
              type: string
              description: CSRF Token（位于cookie）
            id:
              type: integer
              description: 留言id
            msg:
              type: string
              description: 回复信息
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReplyRemarkResponse.yaml
