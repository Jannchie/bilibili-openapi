post:
  tags:
    - 收藏夹
  summary: 清空所有失效内容
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          required:
            - media_id
            - csrf
          type: object
          properties:
            media_id:
              type: integer
              format: int32
              description: 目标收藏夹id
            csrf:
              type: string
              description: CSRF Token（位于cookie）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FavResourceCleanResponse.yaml
