post:
  tags:
    - 收藏夹
  summary: 批量删除内容
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          required:
            - resources
            - media_id
            - csrf
          type: object
          properties:
            resources:
              type: string
              description: 目标内容 ID 列表
            media_id:
              type: integer
              format: int32
              description: 目标收藏夹 ID
            platform:
              type: string
              description: 平台标识
            csrf:
              type: string
              description: CSRF Token（位于 cookie）
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FavResourceBatchDelResponse.yaml
