get:
  tags:
    - 评论区
  servers:
    - url: https://api.bilibili.com
  parameters:
    - name: access_key
      in: query
      description: APP 登录 Token
      schema:
        type: string
    - name: type
      in: query
      description: 评论区类型代码, [类型代码见表](readme.md#评论区类型代码)
      schema:
        type: integer
        enum:
          - 1
          - 11
          - 12
          - 17
      required: true
    - name: oid
      in: query
      description: 目标评论区 id
      schema:
        type: integer
      required: true
    - name: sort
      in: query
      description: 排序方式, 默认为0, 0:按时间 1:按点赞数 2:按回复数
      schema:
        type: integer
        enum:
          - 0
          - 1
          - 2
    - name: nohot
      in: query
      description: 是否不显示热评, 默认为0, 1:不显示 0:显示
      schema:
        type: integer
        enum:
          - 0
          - 1
    - name: ps
      in: query
      description: 每页项数, 默认为20, 定义域:1-20
      schema:
        type: integer
    - name: pn
      in: query
      description: 页码, 默认为1
      schema:
        type: integer
  security:
    - sessionData: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ReplyResponse.yaml
