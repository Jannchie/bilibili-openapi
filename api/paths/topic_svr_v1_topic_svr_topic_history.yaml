get:
  tags:
    - 话题
  summary: 获取历史动态列表
  servers:
    - url: https://api.vc.bilibili.com
  parameters:
    - name: topic_name
      in: query
      description: 话题名称
      schema:
        type: string
    - name: topic_id
      in: query
      description: 话题 ID
      schema:
        type: integer
    - name: offset_dynamic_id
      in: query
      description: 偏移值
      schema:
        type: integer
      required: true
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TopicHistoryResponse.yaml
