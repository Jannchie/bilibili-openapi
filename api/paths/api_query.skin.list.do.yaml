get:
  tags:
    - 主题色
  summary: 获取主题色基本信息 1
  servers:
    - url: https://club.bilibili.com
  parameters:
    - name: access_key
      in: query
      description: APP 登录 Token
      schema:
        type: string
      required: true
    - name: appkey
      in: query
      description: APP 密钥
      schema:
        type: string
      required: true
    - name: build
      in: query
      description: 版本
      schema:
        type: integer
        format: int32
        example: 6082000
      required: true
    - name: sign
      in: query
      description: APP 签名
      schema:
        type: string
      required: true
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/QuerySkinListResponse.yaml
