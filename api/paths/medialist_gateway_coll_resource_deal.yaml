post:
  tags:
    - 收藏
  servers:
    - url: https://api.bilibili.com
  summary: 收藏视频（双端）
  security:
    - sessionData: []
  parameters:
    - in: query
      name: access_key
      schema:
        type: string
      required: false
      description: APP 登录 Token
    - in: query
      name: csrf
      schema:
        type: string
      required: true
      description: CSRF Token（位于 Cookie）
  requestBody:
    required: true
    content:
      application/x-www-form-urlencoded:
        schema:
          $ref: ../components/schemas/ResourceDealRequest.yaml
  responses:
    '200':
      description: 收藏结果
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ResourceDealResponse.yaml
