get:
  tags:
    - 音频
  servers:
    - url: https://api.bilibili.com
  parameters:
    - name: list_type
      in: query
      description: 榜单类型
      schema:
        type: integer
        enum:
          - 1
          - 2
      required: true
    - name: csrf
      in: query
      description: CSRF Token(位于cookie)
      schema:
        type: string
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ToplistAllPeriodResponse.yaml
