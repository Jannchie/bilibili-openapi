post:
  tags:
    - 音频
  servers:
    - url: https://www.bilibili.com
  summary: 投币音频
  parameters:
    - in: cookie
      name: SESSDATA
      required: true
      schema:
        type: string
      description: SESSDATA Cookie
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            sid:
              type: integer
              format: int64
              description: 音频 au id
              example: 15664
            multiply:
              type: integer
              format: int64
              description: 投币数量
              maximum: 2
            csrf:
              type: string
              description: CSRF Token
          required:
            - sid
            - multiply
            - csrf
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AudioCoinAddResponse.yaml
