post:
  tags:
    - 弹幕操作
  servers:
    - url: https://api.bilibili.com
  parameters:
    - name: access_key
      in: query
      description: APP 登录 Token
      schema:
        type: string
    - name: dmid
      in: query
      description: 目标弹幕 dmid
      schema:
        type: integer
      required: true
    - name: oid
      in: query
      description: 目标弹幕所在视频 cid
      schema:
        type: integer
      required: true
    - name: op
      in: query
      description: 操作
      schema:
        type: integer
        enum:
          - 1
          - 2
      required: true
    - name: platform
      in: query
      description: 平台标识
      schema:
        type: string
        enum:
          - web_player
          - android
    - name: csrf
      in: query
      description: CSRF Token(位于 Cookie)
      schema:
        type: string
      required: true
  security:
    - sessionData: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DanmakuThumbupAddResponse.yaml
