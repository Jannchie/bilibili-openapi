get:
  tags:
    - 收藏
  servers:
    - url: https://api.bilibili.com
  summary: 判断视频是否被收藏（双端）
  parameters:
    - in: query
      name: access_key
      schema:
        type: string
      required: false
      description: APP 登录 Token
    - in: query
      name: aid
      schema:
        type: string
      required: true
      description: 稿件 avid 或稿件 bvid
  responses:
    '200':
      description: 收藏状态
      content:
        application/json:
          schema:
            $ref: ../components/schemas/VideoFavouredResponse.yaml
