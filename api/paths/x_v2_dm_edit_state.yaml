post:
  tags:
    - 弹幕操作
  servers:
    - url: https://api.bilibili.com
  parameters:
    - name: access_key
      in: query
      description: APP 登录 Token
      schema:
        type: string
    - name: type
      in: query
      description: 弹幕类选择
      schema:
        type: integer
        enum:
          - 1
      required: true
    - name: oid
      in: query
      description: 视频 cid
      schema:
        type: integer
      required: true
    - name: dmids
      in: query
      description: 弹幕 dmid, 多个 id 之间用 `,` 分隔
      schema:
        type: string
      required: true
    - name: state
      in: query
      description: 操作代码
      schema:
        type: integer
        enum:
          - 1
          - 2
          - 3
      required: true
    - name: csrf
      in: query
      description: CSRF Token(位于 cookie)
      schema:
        type: string
      required: true
  security:
    - sessionData: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/DanmakuEditStateResponse.yaml
