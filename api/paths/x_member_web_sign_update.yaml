post:
  tags:
    - 个人中心
  summary: 修改个人签名
  servers:
    - url: https://api.bilibili.com
  security:
    - sessionData: []
  responses:
    '200':
      description: 成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SignUpdateResponse.yaml
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          required:
            - access_key
            - user_sign
            - csrf
          properties:
            access_key:
              type: string
              description: APP 登录 Token
              default: ''
            user_sign:
              type: string
              description: 要设置的签名内容
              default: ''
            csrf:
              type: string
              description: CSRF Token（位于 cookie）
              default: ''
