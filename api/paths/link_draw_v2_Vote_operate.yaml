post:
  servers:
    - url: https://api.vc.bilibili.com
  security:
    - sessionData: []
  tags:
    - 相簿
  summary: 点赞/取消点赞相簿
  parameters:
    - in: cookie
      name: SESSDATA
      required: true
      schema:
        type: string
      description: SESSDATA Cookie
  requestBody:
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            doc_id:
              type: integer
              format: int64
              description: 相簿 ID
              example: 99184721
            type:
              type: integer
              format: int64
              description: 操作方式
              example: 1
              enum:
                - 1
                - 2
            csrf_token:
              type: string
              description: CSRF Token
          required:
            - doc_id
            - type
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: ../components/schemas/VoteOperateResponse.yaml
