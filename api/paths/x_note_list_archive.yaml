get:
  tags:
    - 笔记列表
  servers:
    - url: https://api.bilibili.com
  summary: 查询稿件私有笔记
  security:
    - sessionData: []
  parameters:
    - in: query
      name: oid
      schema:
        type: integer
      required: true
      description: 目标 ID
    - in: query
      name: oid_type
      schema:
        type: integer
      required: true
      description: 目标 ID 类型
    - in: query
      name: csrf
      schema:
        type: string
      required: false
      description: CSRF Token（位于 cookie）
  responses:
    '200':
      description: 私有笔记列表
      content:
        application/json:
          schema:
            $ref: ../components/schemas/ArchiveNoteListResponse.yaml
