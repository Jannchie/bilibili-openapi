post:
  tags:
    - 轻享卡
  servers:
    - url: https://manga.bilibili.com
  summary: 获取轻享卡信息
  security:
    - sessionData: []
  parameters:
    - in: query
      name: access_key
      schema:
        type: string
      required: false
      description: 登录access_key，与SESSDATA二选其一
  requestBody:
    required: false
    content:
      application/x-www-form-urlencoded:
        schema:
          type: object
          properties:
            access_key:
              type: string
              description: 登录access_key
  responses:
    '200':
      description: 轻享卡信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/GetUserLightCardResponse.yaml
