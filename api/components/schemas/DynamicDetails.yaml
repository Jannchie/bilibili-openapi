type: object
properties:
  user:
    type: object
    description: 转发者用户信息
    properties:
      uid:
        type: integer
        description: 用户 ID
      uname:
        type: string
        description: 用户名
      face:
        type: string
        description: 头像
  item:
    type: object
    description: 转发相关信息
    properties:
      rp_id:
        type: integer
        description: 转发 ID
      uid:
        type: integer
        description: 用户 ID
      content:
        type: string
