      reply:
        type: integer
        description: 回复数
      orig_type:
        type: integer
        description: 被转发动态类型
  origin:
    type: string
    description: 被转发动态信息
  origin_extend_json:
    type: string
    description: 被转发动态补充信息
  origin_user:
    type: object
    description: 被转发用户信息
  activity_infos:
    type: object
    description: 被转发动态参与的活动
