    type: integer
    description: 返回值，0：成功，-101：账号未登录
  message:
    type: string
    description: 错误信息
  ttl:
    type: integer
    description: '1'
  data:
    type: object
    properties:
      list:
        type: array
        description: 经验记录条目列表
