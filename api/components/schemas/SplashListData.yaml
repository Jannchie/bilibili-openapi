type: object
properties:
  splash_request_id:
    type: string
    description: 当前请求 ID
    example: 1663646636605q172a24a57a232q5796
  max_time:
    type: integer
    format: int64
    description: 最长显示时间?
    example: 4
  min_interval:
    type: integer
    format: int64
    description: 最少显示时间? (千分之一秒单位)
    example: 14400
  pull_interval:
    type: integer
    format: int64
    description: 拉取间隔?
    example: 900
  keep_ids:
    type: string
    nullable: true
    description: keep_ids
    example: null
  list:
    type: array
    description: 广告 list
    items:
      $ref: ./SplashListItem.yaml
