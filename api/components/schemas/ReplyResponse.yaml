type: object
properties:
  code:
    type: integer
    description: 返回值
    example: 0
  message:
    type: string
    description: 错误信息
    example: '0'
  ttl:
    type: integer
    example: 1
  data:
    type: object
    properties:
      page:
        type: object
        description: 页信息
        properties:
          num:
            type: integer
            description: 当前页码
            example: 1
          size:
            type: integer
            description: 每页项数
            example: 5
          count:
            type: integer
            description: 根评论条数
            example: 60971
          acount:
            type: integer
            description: 总计评论条数
            example: 76792
      config:
        type: object
        description: 评论区显示控制
        properties:
          showadmin:
            type: integer
            description: 是否显示管理置顶
            example: 1
          showentry:
            type: integer
            example: 1
          showfloor:
            type: integer
            description: 是否显示楼层号
            example: 0
          showtopic:
            type: integer
            description: 是否显示话题
            example: 1
          show_up_flag:
            type: boolean
            description: 是否显示“UP 觉得很赞”标志
            example: true
          read_only:
            type: boolean
            description: 是否只读评论区
            example: false
          show_del_log:
            type: boolean
            description: 是否显示删除记录
            example: false
      replies:
        type: array
        description: 评论列表
        items:
          type: object
      hots:
        type: array
        description: 热评列表
        items:
          type: object
      upper:
        type: object
        description: 置顶评论
        properties:
          mid:
            type: integer
            description: UP 主 mid
          top:
            type: object
          vote:
            type: object
      top:
        type: object
      notice:
        type: object
        description: 评论区公告信息
      vote:
        type: integer
        description: 投票评论?
      blacklist:
        type: integer
      assist:
        type: integer
      mode:
        type: integer
        description: 评论区类型id
      support_mode:
        type: array
        description: 评论区支持的类型id
        items:
          type: integer
      folder:
        type: object
        description: 折叠相关信息
        properties:
          has_folded:
            type: boolean
            description: 评论区是否存在折叠评论
          is_folded:
            type: boolean
            description: 是否折叠?
          rule:
            type: string
            description: 相关规则页面 url
      lottery_card:
        type: object
      show_bvid:
        type: boolean
        description: 显示bvid?
      control:
        type: object
        description: 评论区输入属性
        properties:
          input_disable:
            type: boolean
            description: 是否禁止新增评论
          root_input_text:
            type: string
            description: 评论框文字
          child_input_text:
            type: string
            description: 评论框文字
          bg_text:
            type: string
            description: 空评论区文字
          web_selection:
            type: boolean
            description: 评论是否筛选后可见, false:无需筛选 true:需要筛选
          answer_guide_text:
            type: string
            description: 答题页面链接文字
          answer_guide_icon_url:
            type: string
            description: 答题页面图标 url
          answer_guide_ios_url:
            type: string
            description: 答题页面 ios url
          answer_guide_android_url:
            type: string
            description: 答题页面安卓 url
