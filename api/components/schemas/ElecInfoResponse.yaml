      score:
        type: integer
        description: 电磁力分数
        example: 326
      credit:
        type: integer
        description: 信用分
        example: 100
      state:
        type: integer
        example: 2
      update_date:
        type: integer
        description: 数据刷新时间, 时间戳
        example: 1694966400
