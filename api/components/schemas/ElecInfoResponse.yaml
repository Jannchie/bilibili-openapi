type: object
properties:
  code:
    type: integer
    description: 返回值
    example: 0
  message:
    type: string
    description: 错误信息
    example: '0'
  ttl:
    type: integer
    example: 1
  data:
    type: object
    properties:
      mid:
        type: integer
        description: 当前用户 mid
      level:
        type: integer
        description: 电磁力等级
