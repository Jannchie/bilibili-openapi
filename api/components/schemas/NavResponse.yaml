type: object
properties:
  code:
    type: integer
    description: 返回值，0：成功，-101：账号未登录
  message:
    type: string
    description: 错误信息
  ttl:
    type: integer
    description: '1'
  data:
    type: object
    properties:
      isLogin:
        type: boolean
        description: 是否已登录
      email_verified:
        type: integer
        description: 是否验证邮箱地址
      face:
        type: string
        description: 用户头像 url
      level_info:
        type: object
        properties:
          current_level:
            type: integer
            description: 当前等级
          current_min:
            type: integer
            description: 当前等级经验最低值
          current_exp:
            type: integer
            description: 当前经验
          next_exp:
            type: integer
            description: 升级下一等级需达到的经验
      mid:
        type: integer
        description: 用户 mid
      mobile_verified:
        type: integer
        description: 是否验证手机号
      money:
        type: integer
        description: 拥有硬币数
      moral:
        type: integer
