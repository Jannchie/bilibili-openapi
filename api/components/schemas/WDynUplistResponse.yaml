type: object
properties:
  code:
    type: integer
    description: 返回值，0：成功，-6：未登录
  data:
    type: object
    properties:
      button_statement:
        type: string
        description: 空
      items:
        type: array
        description: 更新者列表
        items:
          type: object
          properties:
            user_profile:
              type: object
              properties:
                info:
                  type: object
                  properties:
                    uid:
                      type: integer
                      description: 用户 ID
                    uname:
                      type: string
                      description: 用户名
                    face:
                      type: string
                      description: 头像
                card:
                  type: object
                  properties:
                    official_verify:
                      type: object
                      properties:
                        type:
                          type: integer
                          description: 认证类型
                        desc:
                          type: string
                          description: 认证描述
                vip:
                  type: object
                  properties:
                    vipType:
                      type: integer
                      description: 会员类型
                    vipDueDate:
                      type: integer
                      description: 会员到期时间
                    dueRemark:
                      type: string
                      description: 到期备注
                    accessStatus:
                      type: integer
                      description: 访问状态
                    vipStatus:
                      type: integer
                      description: 会员状态
                    vipStatusWarn:
                      type: string
                      description: 会员状态警告
                    themeType:
                      type: integer
                      description: 主题类型
                    label:
                      type: object
                      properties:
                        path:
                          type: string
                          description: 路径
                pendant:
                  type: object
                  properties:
                    pid:
                      type: integer
                      description: 挂件 ID
                    name:
                      type: string
                      description: 挂件名称
                    image:
                      type: string
                      description: 挂件图片
                    expire:
                      type: integer
                      description: 过期时间
                    image_enhance:
                      type: string
                      description: 增强图片
                rank:
                  type: string
                  description: 等级
                sign:
                  type: string
                  description: 签名
                level_info:
                  type: object
                  properties:
                    current_level:
                      type: integer
                      description: 当前等级
                    current_min:
                      type: integer
                      description: 当前分钟数
                    current_exp:
                      type: integer
                      description: 当前经验值
                    next_exp:
                      type: string
                      description: 下一级经验值
            has_update:
              type: integer
              description: 是否有更新
      _gt_:
        type: integer
        description: 作用尚不明确
  message:
    type: string
    description: 错误信息
  msg:
    type: number
    description: 空
