type: object
properties:
  code:
    type: integer
    description: 返回值，0：成功，-400：请求错误，-403：访问权限不足
  message:
    type: string
    description: 错误信息
  data:
    type: object
    properties:
      info:
        $ref: ./FavFolderInfoResponse.yaml#/properties/data
      medias:
        type: array
        description: 收藏夹内容
        items:
          type: object
          properties:
            id:
              type: integer
              description: 内容 ID
            type:
              type: integer
              description: 内容类型
            title:
              type: string
              description: 标题
            cover:
              type: string
              description: 封面 URL
            intro:
              type: string
              description: 简介
            page:
              type: integer
              description: 视频分 P 数
            duration:
              type: integer
              description: 音频/视频时长
            upper:
              type: object
              properties:
                mid:
                  type: integer
                  description: UP 主 mid
                name:
                  type: string
                  description: UP 主昵称
                face:
                  type: string
                  description: UP 主头像 URL
            attr:
              type: integer
              description: 属性
            cnt_info:
              type: object
              properties:
                collect:
                  type: integer
                  description: 收藏数
                play:
                  type: integer
                  description: 播放数
                danmaku:
                  type: integer
                  description: 弹幕数
            link:
              type: string
              description: 跳转 URI
            ctime:
              type: integer
              description: 投稿时间
            pubtime:
              type: integer
              description: 发布时间
            fav_time:
              type: integer
              description: 收藏时间
            bv_id:
              type: string
              description: 视频稿件 bvid
            bvid:
              type: string
              description: 视频稿件 bvid
            season:
              type: object
      has_more:
        type: boolean
        description: 收藏夹是否有下一页
      ttl:
        type: integer
        description: 接口返回时间
