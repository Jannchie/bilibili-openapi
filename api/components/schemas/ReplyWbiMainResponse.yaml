type: object
properties:
  code:
    type: integer
    description: 返回值
    example: 0
  message:
    type: string
    description: 错误信息
    example: '0'
  ttl:
    type: integer
    example: 1
  data:
    type: object
    properties:
      cursor:
        type: object
        description: 游标信息
        properties:
          all_count:
            type: integer
            description: 全部评论条数
            example: 86234
          is_begin:
            type: boolean
            description: 是否为第一页, false:否 true:是
            example: true
          prev:
            type: integer
            description: 上页页码
            example: 71880
          next:
            type: integer
            description: 下页页码
            example: 71859
          is_end:
            type: boolean
            description: 是否为最后页, false:否 true:是
            example: false
          mode:
            type: integer
            description: 排序方式
            example: 2
          mode_text:
            type: string
            example: ''
          support_mode:
            type: array
            description: 支持的排序方式
            items:
              type: integer
              example: 2
          name:
            type: string
            description: 评论区类型名
            example: 最新评论
          pagination_reply:
            type: object
            description: 用于懒加载
            properties:
              next_offset:
                type: string
                description: 用于下一次请求的偏移信息
                example: '{"type":3,"direction":1,"Data":{"cursor":71859}}'
              prev_offset:
                type: string
                description: 用于本次请求的偏移信息
          session_id:
            type: string
            description: 空
            example: ''
      replies:
        type: array
        description: 评论列表
        items:
          type: object
      hots:
        type: array
        description: 热评列表
        items:
          type: object
      top:
        type: object
        description: 置顶信息
        properties:
          admin:
            type: object
          upper:
            type: object
          vote:
            type: object
      top_replies:
        type: array
        description: 置顶评论
        items:
          type: string
      lottery_card:
        type: object
        description: 抽奖评论
      folder:
        type: object
        description: 评论折叠信息
        properties:
          has_folded:
            type: boolean
            description: 评论区是否存在折叠评论
          is_folded:
            type: boolean
            description: 是否折叠?
          rule:
            type: string
            description: 相关规则页面 url
      up_selection:
        type: object
      cm:
        type: object
        description: 广告
      cm_info:
        type: object
        description: 广告控制
      effects:
        type: object
      assist:
        type: integer
      blacklist:
        type: integer
      vote:
        type: integer
      lottery:
        type: integer
      config:
        type: object
        description: 评论区显示控制
        properties:
          showadmin:
            type: integer
            description: 是否显示管理置顶
          showentry:
            type: integer
          showfloor:
            type: integer
            description: 是否显示楼层号
          showtopic:
            type: integer
            description: 是否显示话题
            example: 1
          show_up_flag:
            type: boolean
            description: 是否显示"UP 觉得很赞"标志
            example: true
          read_only:
            type: boolean
            description: 是否只读评论区
            example: false
          show_del_log:
            type: boolean
            description: 是否显示删除记录
      upper:
        type: object
        description: UP主信息
        properties:
          mid:
            type: integer
            description: UP 主 mid
            example: 2
      show_bvid:
        type: boolean
        description: 显示 bvid?
      control:
        type: object
        description: 评论区输入属性
        properties:
          input_disable:
            type: boolean
            description: 是否禁止新增评论
            example: false
          root_input_text:
            type: string
            description: 评论框文字
            example: 你渴望拥有力量吗?评论让力量更强大
          child_input_text:
            type: string
            description: 评论框文字
            example: 你渴望拥有力量吗?评论让力量更强大
          giveup_input_text:
            type: string
            description: 作用尚不明确
            example: 不发没关系, 请继续友善哦~
          screenshot_icon_state:
            type: integer
            description: 作用尚不明确
            example: 1
          upload_picture_icon_state:
            type: integer
            description: 作用尚不明确
            example: 1
          answer_guide_text:
            type: string
            description: 答题页面链接文字
            example: 需要升级成为lv2会员后才可以评论, 先去答题转正吧!
          answer_guide_icon_url:
            type: string
            description: 答题页面图标 url
            example: >-
              http://i0.hdslb.com/bfs/emote/96940d16602cacbbac796245b7bb99fa9b5c970c.png
          answer_guide_ios_url:
            type: string
            description: 答题页面 ios url
            example: https://www.bilibili.com/h5/newbie/entry?navhide=1&re_src=12
          answer_guide_android_url:
            type: string
            description: 答题页面安卓 url
            example: https://www.bilibili.com/h5/newbie/entry?navhide=1&re_src=6
          bg_text:
            type: string
            description: 空评论区文字
            example: ''
          empty_page:
            type: object
          show_type:
            type: integer
            example: 1
          show_text:
            type: string
            example: ''
          web_selection:
            type: boolean
            description: 评论是否筛选后可见, false:无需筛选 true:需要筛选
            example: false
          disable_jump_emote:
            type: boolean
            example: false
          enable_charged:
            type: boolean
            example: false
          enable_cm_biz_helper:
            type: boolean
            example: false
          preload_resources:
            type: object
      note:
        type: integer
        example: 1
      esports_grade_card:
        type: object
      callbacks:
        type: object
      context_feature:
        type: string
