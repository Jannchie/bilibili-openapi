type: object
properties:
  code:
    type: integer
    description: 返回值，0：成功，-101：账号未登录
  message:
    type: string
    description: 错误信息
  ttl:
    type: integer
    description: '1'
  data:
    type: object
    properties:
      count:
        type: integer
        description: 记录总数
      list:
        type: array
        description: 登录记录列表
        items:
          type: object
          properties:
            ip:
              type: string
              description: 登录 IP
            time:
              type: integer
              description: 登录时间
            time_at:
              type: string
              description: 登录时间
            status:
              type: boolean
              description: 是否登录成功?
            type:
              type: integer
              description: 登录方式?
            geo:
              type: string
              description: 登录地理位置
