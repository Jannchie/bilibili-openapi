              text:
                type: string
                description: 会员类型文字
              label_theme:
                type: string
                description: 会员类型
          avatar_subscript:
            type: integer
            description: 是否显示会员图标
          nickname_color:
            type: string
            description: 会员昵称颜色
      email_status:
        type: integer
        description: 是否验证邮箱地址
      tel_status:
        type: integer
        description: 是否验证手机号
      official:
        type: object
        properties:
          role:
            type: integer
            description: 认证类型
          title:
            type: string
            description: 认证信息
          desc:
            type: string
            description: 认证备注
          type:
            type: string
            description: 认证备注
      identification:
        type: integer
        description: '1'
      invite:
        type: object
        properties:
          invite_remind:
            type: integer
            description: '1'
          display:
            type: boolean
            example: true
      is_tourist:
        type: integer
        description: '0'
      pin_prompting:
        type: integer
        description: '0'
