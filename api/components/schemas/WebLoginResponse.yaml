type: object
properties:
  code:
    type: integer
    description: >-
      返回值，0：成功，-105：验证码错误，-400：请求错误，-629：账号或密码错误，-653：用户名或密码不能为空，-662：提交超时,请重新提交，-2001：缺少必要的的参数，-2100：需验证手机号或邮箱，2400：登录秘钥错误，2406：验证极验服务出错，86000：RSA解密失败
  message:
    type: string
    description: 错误信息
  data:
    type: object
    properties:
      message:
        type: string
        description: 扫码状态信息
      refresh_token:
        type: string
        description: 刷新`refresh_token`
      status:
        type: integer
        description: '0'
      timestamp:
        type: integer
        description: 登录时间
      url:
        type: string
        description: 游戏分站跨域登录 URL
