type: object
properties:
  code:
    type: integer
    description: 返回值
    example: 0
  message:
    type: string
    description: 错误信息
    example: '0'
  ttl:
    type: integer
    description: 作用尚不明确
    example: 1
  data:
    type: object
    properties:
      page_source:
        type: object
        description: 播放方式情况
        properties:
          dynamic:
            type: integer
            description: 通过动态
            example: 173
          other:
            type: integer
            description: 其他方式
            example: 1440
          related_video:
            type: integer
            description: 通过推荐列表
            example: 1813
          search:
            type: integer
            description: 通过搜索
            example: 1980
          space:
            type: integer
            description: 空间列表播放
            example: 501
          tenma:
            type: integer
            description: 天马(APP推荐信息流)来源
            example: 4087
      play_proportion:
        type: object
        description: 播放平台情况
        properties:
          android:
            type: integer
            description: 安卓端
            example: 6060
          h5:
            type: integer
            description: 移动端 h5 页面
            example: 410
          ios:
            type: integer
            description: ios 端
            example: 1325
          out:
            type: integer
            description: 站外
            example: 0
          pc:
            type: integer
            description: 电脑版网页
            example: 2137
