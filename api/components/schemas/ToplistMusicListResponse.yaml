type: object
properties:
  code:
    type: integer
    description: 返回值
    example: 0
  message:
    type: string
    description: 错误信息
    example: '0'
  ttl:
    type: integer
    example: 1
  data:
    type: object
    properties:
      list:
        type: array
        items:
          type: object
          properties:
            music_id:
              type: string
              description: 音频MAID
              example: MA409252256362326366
            music_title:
              type: string
              description: 音频标题
              example: 極楽浄土
            singer:
              type: string
              description: 音频作者
              example: GARNiDELiA
            album:
              type: string
              description: 音频专辑
              example: 約束 -Promise code-
            mv_aid:
              type: integer
              description: 音频MV的avid, 若该音频无MV则该字段为0
              example: 28361833
            mv_bvid:
              type: string
              description: 音频MV的bvid
              example: BV1us41137Fd
            mv_cover:
              type: string
              description: 音频封面url
              example: >-
                https://i0.hdslb.com/bfs/station_src/music_metadata/07e0d9826c574e37df25387cab6df062.jpg
            heat:
              type: integer
              description: 热度值
              example: 5328979
            rank:
              type: integer
              description: 排序值, 1为最高排序, DESC方式
              example: 1
            can_listen:
              type: boolean
              description: 平台是否有版权
              example: true
            recommendation:
              type: string
              example: ''
            creation_aid:
              type: integer
              description: 关联稿件avid
              example: 910787823
            creation_bvid:
              type: string
              description: 关联稿件bvid
              example: BV1HM4y1b79Z
            creation_cover:
              type: string
              description: 关联稿件封面url
              example: >-
                http://i1.hdslb.com/bfs/archive/5780a05437ec9880301ed093537d6af97b0f8bdb.jpg
            creation_title:
              type: string
              description: 关联稿件标题
              example: 【MARiA】乘风2023初舞台!《极乐净土》，虽迟但到!
            creation_up:
              type: integer
              description: 关联稿件UP主mid
              example: 110352985
            creation_nickname:
              type: string
              description: 关联稿件UP主昵称
              example: GARNiDELiA
            creation_duration:
              type: integer
              description: 关联稿件时长
              example: 100
            creation_play:
              type: integer
              description: 关联稿件播放量
              example: 13487670
            creation_reason:
              type: string
              description: 关联稿件二级分区名
              example: 官方现场
            achievements:
              type: array
              description: 获得成就
              items:
                type: string
                example: 重回榜单
            material_id:
              type: integer
              example: 0
            material_use_num:
              type: integer
              example: 0
            material_duration:
              type: integer
              example: 0
            material_show:
              type: integer
              example: 1
            song_type:
              type: integer
              example: 2
