            example: 根据近一年活跃粉丝数据进行评估, 良好的粉丝活跃度是影响力的基础.
          date:
            type: integer
            description: 刷新时间, 时间戳
            example: 1593878400
      credit:
        type: object
        description: 信用分
        properties:
          data:
            type: integer
            example: 100
          prev:
            type: integer
            description: 作用尚不明确
            example: 100
          desc:
            type: string
            description: 描述
            example: 良好的投稿记录将维持较高的信用分, 违反投稿公约的行为将扣除信用分.
          date:
            type: integer
            description: 刷新时间, 时间戳
            example: 1594106147
