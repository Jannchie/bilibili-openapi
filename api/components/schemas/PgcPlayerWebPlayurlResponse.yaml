type: object
properties:
  code:
    type: integer
    description: 返回值
    example: 0
  message:
    type: string
    description: 错误信息
    example: success
  result:
    type: object
    properties:
      accept_format:
        type: string
        description: 视频支持的全部格式, 每项用`,`分隔
        example: flv480,mp4
      code:
        type: integer
        description: 作用尚不明确
        example: 0
      seek_param:
        type: string
        description: 固定值:start
        example: start
      is_preview:
        type: integer
        description: 作用尚不明确
        example: 0
      fnval:
        type: integer
        description: 请求时提供的fnval
        example: 0
      video_project:
        type: boolean
        description: 恒为true
        example: true
      fnver:
        type: integer
        description: 请求时提供的fnver
        example: 0
      type:
        type: string
        description: 视频流类型(DASH,FLV,MP4)
        example: FLV
      bp:
        type: integer
        description: 是否可以承包
        example: 0
      result:
        type: string
        description: 作用尚不明确
        example: suee
      seek_type:
        type: string
        description: offset(dash,flv),second(mp4)
        example: offset
      from:
        type: string
        description: 作用尚不明确
        example: local
      video_codecid:
        type: integer
        description: 默认选择视频流的编码id
        example: 7
      record_info:
        type: object
        properties:
          record_icon:
            type: string
            description: 恒为空串
            example: ''
          record:
            type: string
            description: 显示文案
            example: 登记号:10417060172092207
      durl:
        type: array
        description: 视频分段, 注:仅flv/mp4存在此项
        items:
          type: object
          properties:
            size:
              type: integer
              description: 视频大小, 单位为Byte
              example: 111138876
            ahead:
              type: string
            length:
              type: integer
              description: 视频长度, 单位为毫秒
              example: 1394090
            vhead:
              type: string
              description: 作用尚不明确
            backup_url:
              type: array
              description: 备用视频流, 注:url内容存在转义符, 有效时间为120min
              items:
                type: string
                example: >-
                  https://upos-sz-mirrorcoso1.bilivideo.com/upgcxcode/01/96/3629601/3629601_da8-1-32.flv?e=ig8euxZM2rNcNbRVhwdVhwdlhWdVhwdVhoNvNC8BqJIzNbfqXBvEqxTEto8BTrNvN0GvT90W5JZMkX_YN0MvXg8gNEV4NC8xNEV4N03eN0B5tZlqNxTEto8BTrNvNeZVuJ10Kj_g2UB02J0mN0B5tZlqNCNEto8BTrNvNC7MTX502C8f2jmMQJ6mqF2fka1mqx6gqj0eN0B599M=&uipk=5&nbs=1&deadline=1656098195&gen=playurlv2&os=coso1bv&oi=2946990771&trid=a1db84b216ea45dd89225f02a09093fdp&mid=0&platform=pc&upsig=878be08cc0e6bdea705952529e7e6785&uparams=e,uipk,nbs,deadline,gen,os,oi,trid,mid,platform&bvc=vod&nettype=0&orderid=1,3&agrr=1&bw=79726&logo=40000000
            url:
              type: string
              description: 视频流url, 注:url内容存在转义符, 有效时间为120min
              example: >-
                https://cn-lnsy-cu-v-02.bilivideo.com/upgcxcode/01/96/3629601/3629601_da8-1-32.flv?e=ig8euxZM2rNcNbRVhwdVhwdlhWdVhwdVhoNvNC8BqJIzNbfqXBvEqxTEto8BTrNvN0GvT90W5JZMkX_YN0MvXg8gNEV4NC8xNEV4N03eN0B5tZlqNxTEto8BTrNvNeZVuJ10Kj_g2UB02J0mN0B5tZlqNCNEto8BTrNvNC7MTX502C8f2jmMQJ6mqF2fka1mqx6gqj0eN0B599M=&uipk=5&nbs=1&deadline=1656098195&gen=playurlv2&os=bcache&oi=2946990771&trid=0000a1db84b216ea45dd89225f02a09093fdp&mid=0&platform=pc&upsig=7a5c4f25b9056359127191390a73bedc&uparams=e,uipk,nbs,deadline,gen,os,oi,trid,mid,platform&cdnid=3281&bvc=vod&nettype=0&orderid=0,3&agrr=1&bw=79726&logo=80000000
            order:
              type: integer
              description: 视频分段序号, 某些视频会分为多个片段(从1顺序增长)
              example: 1
            md5:
              type: string
      no_rexcode:
        type: integer
        example: 0
      format:
        type: string
        description: 视频格式
        example: flv480
      support_formats:
        type: array
        description: 支持格式的详细信息
        items:
          type: object
          properties:
            quality:
              type: integer
              description: 视频清晰度代码
              example: 32
            format:
              type: string
              description: 视频格式
              example: flv480
            new_description:
              type: string
              description: 格式描述
              example: 480P 清晰
            description:
              type: string
              description: 格式描述
              example: 清晰 480P
            display_desc:
              type: string
              description: 格式描述
              example: 480P
            superscript:
              type: string
              example: ''
            codecs:
              type: array
              description: 编码格式列表
              items:
                type: string
            need_login:
              type: boolean
              description: 需要登录
            need_vip:
              type: boolean
              description: 需要大会员
      message:
        type: string
        description: 作用尚不明确
      accept_quality:
        type: array
        description: 视频支持的分辨率代码列表
        items:
          type: integer
          example: 32
      quality:
        type: integer
        description: 当前的视频分辨率代码, 值含义见表格
        example: 32
      timelength:
        type: integer
        description: 视频长度, 单位为毫秒, 不同分辨率/格式可能有略微差异
        example: 1394090
      has_paid:
        type: boolean
        example: false
      clip_info_list:
        type: array
        description: 空, 待补充
        items:
          type: object
      accept_description:
        type: array
        description: 视频支持的分辨率列表
        items:
          type: string
          example: 清晰 480P
      status:
        type: integer
        example: 2
