type: object
properties:
  type:
    type: integer
    description: 会员类型, 0:无 1:月会员 2:年会员
    example: 2
  status:
    type: integer
    description: 会员状态, 0:无 1:有
    example: 1
  due_date:
    type: integer
    description: 会员到期时间, 时间戳 毫秒
    example: 1620316800000
  vip_pay_type:
    type: integer
    description: 会员开通状态, 0:无 1:有
    example: 0
