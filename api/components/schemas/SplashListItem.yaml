type: object
properties:
  id:
    type: integer
    format: int64
    description: 广告 ID
    example: 9460
  type:
    type: integer
    format: int64
    description: 类型
    example: 1
  card_type:
    type: integer
    format: int64
    description: 卡片类型
    example: 39
  duration:
    type: integer
    format: int64
    description: 持续时间?
    example: 5
  begin_time:
    type: integer
    format: int64
    description: 开始展示时间 (秒级时间戳)
    example: 1663689600
  end_time:
    type: integer
    format: int64
    description: 停止展示时间 (毫秒级时间戳)
    example: 1663775999
  thumb:
    type: string
    format: url
    description: 广告图片
    example: >-
      https://i0.hdslb.com/bfs/sycp/creative_img/202208/cb001c291c6011940e29531dcce6b1e8.webp
  hash:
    type: string
    description: hash
    example: 712d3df973f99fdcd30c2419d19630dc
  logo_url:
    type: string
    description: logo URL
    example: ''
  logo_hash:
    type: string
    description: logo hash
    example: ''
  skip:
    type: integer
    format: int64
    description: 是否跳转?
    example: 1
  uri:
    type: string
    format: url
    description: 跳转的 URL
    example: >-
      https://market.m.taobao.com/app/mwdk-industry/mwdk-shopping-base/pages/peppa.html?disableNav=YES&merchantCode=HM&pageId=105240&path=%2Fact%2Frax%2Fmanual1455861656935693595&renderChannelCode=HM&siteCode=HM_8_7dd8299642994fa196f9a9aae4fd4391_3&spma=a225z&usePayment=alipayMiniApp&utm_campaign=dwlx&utm_source=1234&targetShopId=199273419
  video_url:
    type: string
    format: url
    description: 视频 URL
    example: >-
      http://upos-sz-static.bilivideo.com/ssaxcode/89/jl/n220831a21uql976d44zun4y0ykmjl89-1-SPLASH.mp4
  video_hash:
    type: string
    description: 视频 hash
    example: ae10333c160452cc2755d079db10b597
  video_width:
    type: integer
    format: int64
    description: 视频宽度
    example: 1080
  video_height:
    type: integer
    format: int64
    description: 视频高度
    example: 1920
  uri_title:
    type: string
    description: uri_title
    example: ''
  source:
    type: integer
    format: int64
    description: 来源
    example: 929
  cm_mark:
    type: integer
    format: int64
    description: cm_mark
    example: 1
  ad_cb:
    type: string
    description: 广告回调?
    example: >-
      COfrARC7jxUY9EkgADDWwCE4oQdCIDE2NjM2NDY2MzY1ODhxMTcyYTI2YTE5MmE5NnE1NDE0SKy0xMi1MFIG5aSp5rSlaP///////////wFw////////////AYABS4gB5+sBsgEg8mQFw0bBxGOGYE8OBhMOd3DE8OGFZXhookrFX4s3UrrwAruPFdgD9Ek=
  resource_id:
    type: integer
    format: int64
    description: 资源 ID
    example: 926
  request_id:
    type: string
    description: 请求 ID
    example: 1663646636588q172a26a192a96q5414
  client_ip:
    type: string
    format: ipv4
    description: 客户端 IP
    example: 117.14.146.37
  is_ad:
    type: boolean
    description: 是否是广告?
    example: true
  is_ad_loc:
    type: boolean
    description: 是否是广告 loc?
    example: true
  schema_title:
    type: string
    description: Schema 标题
    example: 滑动进入第三方应用
  schema_callup_white_list:
    type: array
    description: 跳转的 APP 的白名单
    items:
      type: string
  extra:
    $ref: ./SplashListItemExtra.yaml
  enable_pre_download:
    type: boolean
    description: 是否可以当场下载 APP?
    example: true
  enable_background_download:
    type: boolean
    description: 是否可以静默下载 APP?
    example: true
  interact_type:
    type: integer
    format: int64
    description: 是否可以跳转 (互动)?
    example: 1
  interact_url:
    type: string
    format: url
    description: 跳转 (互动) URL
    example: >-
      https://market.m.taobao.com/app/mwdk-industry/mwdk-shopping-base/pages/peppa.html?disableNav=YES&merchantCode=HM&pageId=105240&path=%2Fact%2Frax%2Fmanual1455861656935693595&renderChannelCode=HM&siteCode=HM_8_7dd8299642994fa196f9a9aae4fd4391_3&spma=a225z&usePayment=alipayMiniApp&utm_campaign=dwlx&utm_source=1234&targetShopId=199273419
  interact_distance:
    type: integer
    format: int64
    description: 互动距离
    example: 60
  guide_button_list:
    type: array
    description: 所有的按钮
    items:
      $ref: ./SplashListItemGuideButton.yaml
  mark_with_skip_style:
    type: integer
    format: int64
    description: mark_with_skip_style
    example: 0
  skip_button_height:
    type: number
    format: float
    description: skip_button_height
    example: 0.0557
